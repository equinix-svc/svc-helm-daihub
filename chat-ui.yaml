# Light chat page to test the AI gateway end to end, at https://<node>/chat/
# Apply on the node:
#   sudo k3s kubectl apply -f https://raw.githubusercontent.com/equinix-svc/svc-helm-daihub/main/chat-ui.yaml
# Remove: sudo k3s kubectl delete -f <same url>
# The image (nginx + one static HTML page) is built from src/chat-ui/ by the "images" GitHub workflow.
# Day 0 installs it with the stack and sets the registry credentials (REGISTRY_USER, REGISTRY_TOKEN). The page calls LiteLLM on the same
# host (/v1/chat/completions) with the key you paste in it.
apiVersion: apps/v1
kind: Deployment
metadata: { name: chat-ui, namespace: ai-gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: chat-ui } }
  template:
    metadata: { labels: { app: chat-ui } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]       # optional: only needed while the package is private
      containers:
        - name: nginx
          image: ghcr.io/equinix-svc/svc-helm-daihub/chat-ui:0.1.0
          imagePullPolicy: Always
          env:
            - name: DEMO_KEY                    # the page needs no key: nginx adds this one to requests that carry none
              valueFrom: { secretKeyRef: { name: chat-demo-key, key: DEMO_KEY, optional: true } }
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /chat/, port: 80 }, periodSeconds: 5 }
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: chat-ui, namespace: ai-gateway }
spec: { selector: { app: chat-ui }, ports: [{ port: 80 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-ui
  namespace: ai-gateway
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - http:
        paths:
          - path: /chat
            pathType: Prefix
            backend: { service: { name: chat-ui, port: { number: 80 } } }
---
# Registers the demo key in LiteLLM: restricted to llm-pool, with a budget and a rate limit. Safe to re-run.
apiVersion: batch/v1
kind: Job
metadata: { name: chat-demo-key-init, namespace: ai-gateway }
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: curlimages/curl:8.10.1
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-env, key: LITELLM_MASTER_KEY } }
            - name: DEMO_KEY
              valueFrom: { secretKeyRef: { name: chat-demo-key, key: DEMO_KEY } }
          command:
            - sh
            - -c
            - |
              until curl -fs http://ai-litellm:4000/health/readiness >/dev/null; do echo "waiting for LiteLLM"; sleep 10; done
              code=$(curl -s -o /tmp/r -w '%{http_code}' http://ai-litellm:4000/key/generate \
                -H "Authorization: Bearer $LITELLM_MASTER_KEY" -H 'Content-Type: application/json' \
                -d "{\"key\":\"$DEMO_KEY\",\"key_alias\":\"chat-demo\",\"models\":[\"llm-pool\"],\"max_budget\":5,\"rpm_limit\":30,\"metadata\":{\"purpose\":\"chat page demo key\"}}")
              echo "key/generate -> $code"
              [ "$code" = 200 ] || { cat /tmp/r; exit 1; }
